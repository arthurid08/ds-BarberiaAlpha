<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Confirmação - Barbearia</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h2>Agendamento Confirmado!</h2>
        <p>Obrigado! Os dados do seu agendamento foram recebidos com sucesso pelo nosso sistema:</p>
        
        <div class="comprovante">
            <p><strong>Cliente:</strong> {{ nome }}</p>
            <p><strong>Telefone:</strong> {{ telefone }}</p>
            <p><strong>Serviço:</strong> {{ servico }}</p>
            <p><strong>Barbeiro:</strong> {{ barbeiro }}</p>
            <p><strong>Data:</strong> {{ data }}</p>
            <p><strong>Horário:</strong> {{ hora }}</p>
        </div>

        <a href="/" class="btn">Voltar para a Página Inicial</a>
    </div>
</body>
</html>
